<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, World!</title>
  <link rel="icon" type="image/svg+xml" href="squirrel.svg">
  <style>
    :root {
      --bg: #faf6ef;
      --text: #2b1a0e;
      --muted: #7a6654;
      --card-bg: #fffaf2;
      --card-border: #ead9c3;
      --accent: #b5651d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1f1812;
        --text: #f3e9dc;
        --muted: #b8a692;
        --card-bg: #2a2018;
        --card-border: #4a3a2c;
        --accent: #d98e3f;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    .logo {
      width: min(240px, 60vw);
      height: auto;
    }

    h1 {
      margin: 24px 0 8px;
      font-size: clamp(2rem, 8vw, 3.5rem);
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }

    /* Game links */

    nav {
      width: min(640px, 100%);
      margin-top: 32px;
    }

    .games {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 600px) {
      .games {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 18px 12px;
      border: 2px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .game:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .game:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .game img {
      width: 64px;
      height: 64px;
    }

    /* Squirrel animation: sniff, jump, bury the nut, catch a new one */

    .logo * {
      animation-duration: 16s;
      animation-iteration-count: infinite;
    }

    .logo .sq   { animation-name: sq;   transform-origin: 120px 182px; }
    .logo .head { animation-name: head; transform-origin: 126px 104px; }
    .logo .arm  { animation-name: arm;  transform-origin: 130px 122px; }
    .logo .nut  { animation-name: nut;  transform-origin: 154px 120px; }
    .logo .dirt { animation-name: dirt; transform-origin: 168px 183px; opacity: 0; }

    @keyframes sq {
      0%, 42%   { transform: translateY(0) scale(1, 1); }
      44%       { transform: translateY(0) scale(1.04, 0.92); animation-timing-function: ease-out; }
      47%       { transform: translateY(-30px) scale(0.97, 1.05); animation-timing-function: ease-in; }
      50%       { transform: translateY(0) scale(1, 1); }
      51%       { transform: translateY(0) scale(1.04, 0.94); }
      53%, 79%  { transform: translateY(0) scale(1, 1); }
      80.5%     { transform: translateY(3px) scale(1, 1); }
      82%, 100% { transform: translateY(0) scale(1, 1); }
    }

    @keyframes head {
      0%, 30%   { transform: rotate(0); }
      32%       { transform: rotate(14deg); }
      33.5%     { transform: rotate(9deg); }
      35%       { transform: rotate(14deg); }
      36.5%     { transform: rotate(9deg); }
      38%       { transform: rotate(14deg); }
      40%, 55%  { transform: rotate(0); }
      57%       { transform: rotate(22deg); }
      60%       { transform: rotate(26deg); }
      62%       { transform: rotate(20deg); }
      64%       { transform: rotate(26deg); }
      66%       { transform: rotate(22deg); }
      68%, 71%  { transform: rotate(0); }
      73%, 79%  { transform: rotate(-18deg); }
      81%       { transform: rotate(6deg); }
      83%, 100% { transform: rotate(0); }
    }

    @keyframes arm {
      0%, 56%   { transform: rotate(0); }
      59%       { transform: rotate(40deg); }
      61%       { transform: rotate(28deg); }
      63%       { transform: rotate(42deg); }
      65%       { transform: rotate(28deg); }
      67%, 74%  { transform: rotate(0); }
      77%, 79.5% { transform: rotate(-25deg); }
      80.5%     { transform: rotate(10deg); }
      83%, 100% { transform: rotate(0); }
    }

    @keyframes nut {
      0%, 57%   { transform: translate(0, 0) scale(1); opacity: 1; animation-timing-function: ease-in; }
      61%, 63%  { transform: translate(12px, 50px) scale(0.8); opacity: 1; }
      66%       { transform: translate(12px, 56px) scale(0.6); opacity: 0; }
      73.9%     { transform: translate(28px, -150px) scale(1); opacity: 0; }
      74%       { transform: translate(28px, -150px) scale(1); opacity: 1; animation-timing-function: ease-in; }
      78.5%     { transform: translate(28px, -14px) scale(1); opacity: 1; animation-timing-function: ease-out; }
      80%, 100% { transform: translate(0, 0) scale(1); opacity: 1; }
    }

    @keyframes dirt {
      0%, 59%   { transform: scale(0); opacity: 0; }
      60%       { transform: scale(0.3); opacity: 1; }
      62%       { transform: scale(0.75, 0.6); opacity: 1; }
      64%, 76%  { transform: scale(1); opacity: 1; }
      82%       { transform: scale(1); opacity: 0; }
      83%, 100% { transform: scale(0); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .logo * {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Squirrel holding an acorn">
    <g class="sq">
      <!-- tail -->
      <path d="M80 170 C30 172 16 112 44 70 C62 43 102 40 109 66 C113 83 96 93 86 84 C93 101 84 120 88 140 C90 153 87 163 80 170 Z" fill="#8b4a14"/>
      <path d="M70 152 C44 140 40 104 58 80 C68 67 86 62 93 70" fill="none" stroke="#d98e3f" stroke-width="9" stroke-linecap="round"/>

      <!-- body -->
      <ellipse cx="112" cy="136" rx="32" ry="40" fill="#b5651d"/>
      <ellipse cx="124" cy="142" rx="16" ry="27" fill="#f3d9b1"/>

      <!-- foot -->
      <ellipse cx="128" cy="175" rx="21" ry="7" fill="#8b4a14"/>

      <g class="head">
        <!-- ear -->
        <path d="M120 68 Q120 42 128 40 Q138 46 140 64 Z" fill="#8b4a14"/>
        <path d="M125 64 Q125 50 129 48 Q134 52 135 62 Z" fill="#f3d9b1"/>

        <!-- head -->
        <circle cx="138" cy="84" r="25" fill="#b5651d"/>
        <ellipse cx="152" cy="92" rx="12" ry="9" fill="#f3d9b1"/>
        <circle cx="146" cy="78" r="4" fill="#2b1a0e"/>
        <circle cx="147.3" cy="76.7" r="1.3" fill="#ffffff"/>
        <circle cx="163" cy="88" r="3" fill="#2b1a0e"/>
      </g>

      <!-- acorn -->
      <g class="nut">
        <ellipse cx="154" cy="124" rx="8" ry="10" fill="#c9903a"/>
        <path d="M145 120 Q154 108 163 120 Z" fill="#6b3d12"/>
        <rect x="153" y="108" width="2" height="5" rx="1" fill="#6b3d12"/>
      </g>

      <!-- arm -->
      <g class="arm">
        <ellipse cx="140" cy="126" rx="12" ry="6" transform="rotate(-15 140 126)" fill="#8b4a14"/>
      </g>
    </g>

    <!-- dirt mound for the buried nut -->
    <path class="dirt" d="M150 183 Q168 162 186 183 Z" fill="#6b3d12"/>
  </svg>
  <h1>Hello, World!</h1>
  <p>Welcome to my little corner of the web.</p>

  <nav aria-label="Games">
    <ul class="games">
      <li>
        <a class="game" href="https://menaechmus.github.io/Cribbage/">
          <img src="cribbage.svg" alt="">
          <span>Cribbage</span>
        </a>
      </li>
      <li>
        <a class="game" href="https://menaechmus.github.io/squirrel-game/">
          <img src="squirrel.svg" alt="">
          <span>Squirrel Game</span>
        </a>
      </li>
      <li>
        <a class="game" href="https://menaechmus.github.io/WordGame/">
          <img src="word-game.svg" alt="">
          <span>Word Game</span>
        </a>
      </li>
      <li>
        <a class="game" href="https://menaechmus.github.io/Backgammon/">
          <img src="backgammon.svg" alt="">
          <span>Backgammon</span>
        </a>
      </li>
      <li>
        <a class="game" href="https://menaechmus.github.io/ConnectFour/">
          <img src="connect-four.svg" alt="">
          <span>Connect Four</span>
        </a>
      </li>
      <li>
        <a class="game" href="https://menaechmus.github.io/PeriodicTable/">
          <img src="periodic-table.svg" alt="">
          <span>Periodic Table</span>
        </a>
      </li>
    </ul>
  </nav>
</body>
</html>
