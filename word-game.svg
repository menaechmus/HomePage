<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">Letter tile</title>

  <!-- tile edge -->
  <rect x="32" y="42" width="136" height="136" rx="18" fill="#8b4a14"/>

  <!-- tile face -->
  <rect x="32" y="30" width="136" height="136" rx="18" fill="#f3d9b1" stroke="#c9903a" stroke-width="4"/>

  <!-- letter and points -->
  <text x="96" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#2b1a0e">W</text>
  <text x="150" y="152" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#2b1a0e">4</text>
</svg>
