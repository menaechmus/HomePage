<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title">
  <title id="title">The periodic table's tile for gold</title>

  <!-- tile edge -->
  <rect x="32" y="42" width="136" height="136" rx="18" fill="#b0851a"/>

  <!-- tile face -->
  <rect x="32" y="30" width="136" height="136" rx="18" fill="#f6c955" stroke="#d9a520" stroke-width="4"/>

  <!-- atomic number, symbol and weight -->
  <text x="48" y="62" font-family="system-ui, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#2b2205">79</text>
  <text x="100" y="126" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#2b2205">Au</text>
  <text x="100" y="152" text-anchor="middle" font-family="system-ui, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#2b2205">196.97</text>
</svg>
