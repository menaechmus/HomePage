  <circle cx="146" cy="78" r="4" fill="#2b1a0e"/>
  <circle cx="147.3" cy="76.7" r="1.3" fill="#ffffff"/>
  <circle cx="163" cy="88" r="3" fill="#2b1a0e"/>

  <!-- acorn -->
